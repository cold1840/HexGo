[package]
name = "HexGo"
version = "0.1.0"
edition = "2024"

[lib]
name = "hex_go"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = "0.19.1"
bevy_embedded_assets = "0.16"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.19.1", features = ["android-game-activity"] }

[package.metadata.android]
version-code = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"