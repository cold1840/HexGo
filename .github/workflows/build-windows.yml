name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --profile dist --verbose

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/HexGo | Out-Null
          Copy-Item target/dist/HexGo.exe dist/HexGo/
          Compress-Archive `
            -Path dist/HexGo `
            -DestinationPath dist/HexGo-${{ inputs.version }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/HexGo-${{ inputs.version }}-windows-x86_64.zip
          if-no-files-found: error
