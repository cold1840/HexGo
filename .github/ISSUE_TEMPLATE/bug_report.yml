name: Bug report / 错误报告
description: Report a reproducible HexGo defect / 报告可复现的 HexGo 缺陷
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not disclose security vulnerabilities here; follow SECURITY.md instead.

        感谢报告问题。请勿在此披露安全漏洞，应改为遵循 SECURITY.zh-CN.md。
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题摘要
      description: Describe the defect clearly. / 请清楚描述缺陷。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Start...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include commit, OS, Rust version, and relevant configuration. / 请提供 commit、操作系统、Rust 版本和相关配置。
    validations:
      required: true
  - type: textarea
    id: rule_context
    attributes:
      label: Rule context / 规则背景
      description: Link the relevant rule section if this affects gameplay. / 如果影响游戏行为，请链接相关规则章节。
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence / 其他信息
      description: Add logs, screenshots, or a minimal position without secrets or private data. / 可提供日志、截图或最小局面，但不要包含密钥或隐私数据。
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查清单
      options:
        - label: I searched for an existing issue. / 我已搜索现有 Issue。
          required: true
        - label: This report does not contain a security vulnerability or private data. / 本报告不包含安全漏洞或隐私数据。
          required: true
