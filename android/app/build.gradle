plugins {
    alias(libs.plugins.android.application)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def cargoToml = rootProject.file("../Cargo.toml").text
def cargoVersion = (cargoToml =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
def androidVersionCode =
        (cargoToml =~ /(?m)^version-code\s*=\s*(\d+)/)[0][1].toInteger()
android {
    namespace 'top.zhenyan121.hexgo'
    compileSdk 34

    defaultConfig {
        applicationId "top.zhenyan121.hexgo"
        minSdk 31
        targetSdk 33
        versionCode androidVersionCode
        versionName cargoVersion
        // set up targets
        ndk {
            abiFilters 'arm64-v8a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            assets.srcDirs += files('../../../../assets')

            res.srcDirs += files('../../assets/android-res')
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
